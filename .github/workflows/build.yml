name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify plugin
        run: mvn -B verify
      - name: Verify structure editor
        working-directory: tools/structure_editor
        run: python -m unittest discover -s tests -v
