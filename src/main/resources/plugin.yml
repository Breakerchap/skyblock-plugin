name: SkyblockProgression
version: 1.0.0
main: io.github.breakerchap.skyblock.SkyblockPlugin
api-version: '26.3'
author: Breakerchap
description: Self-contained vanilla-client Skyblock world, progression, structures, communal goals and traders.
website: https://github.com/Breakerchap/skyblock-plugin

commands:
  skyblock:
    description: Skyblock progression and administration.
    usage: /skyblock [progress|islands|trader|grant]
    aliases: [sbprogress]

permissions:
  skyblock.admin:
    description: Generate islands, summon test traders and grant progression advancements.
    default: op
