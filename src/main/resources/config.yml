# The plugin creates this world as a true void world and sends first-time players there.
world: "skyblock"

world-generation:
  spawn-y: 64
  teleport-new-players: true
  # Useful while developing the starter island; normally leave false.
  rebuild-starter-on-start: false

islands:
  # Generate all progression/exploration islands around the starter island.
  auto-generate: true
  # Set base-y to an integer to override world spawn Y for exploration islands.
  # base-y: 64

trader:
  # Wayfarer's Bell cooldown per player.
  summon-cooldown-seconds: 3600
  # Number of Skyblock-focused trades placed on each wandering trader.
  trade-count: 8

community:
  cobble:
    threshold: 5000
  builder:
    threshold: 3000
  hunter:
    threshold: 250
  life:
    threshold: 50
  forest:
    threshold: 250
  fish:
    threshold: 100
  crafting:
    threshold: 5000
  harvest:
    threshold: 2000
